name: Native regression

on:
  pull_request:
  push:
    branches:
      - master
      - codex/cpp26-core
      - codex/wheel-release
    tags:
      - 'huoxing-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-regression-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.compiler }} native and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install locked Pixi environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          locked: true
      - name: Check native formatting
        if: matrix.compiler == 'gcc'
        run: pixi run format-check
      - name: Build and run native and Python regression tests
        run: pixi run test-${{ matrix.compiler }}

  package:
    name: Build and verify deployment bundle
    needs: regression
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          locked: true
      - name: Install wheel relocation utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
      - name: Build wheel and deployment bundle
        run: pixi run python tools/build_release.py
      - name: Test installed wheel and deployment in a relocated environment
        run: pixi run python tools/verify_release.py "$(cat dist/bundle-path.txt)"
      - name: Upload verified deployment bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: huoxing-linux-x86_64-cp312-${{ github.sha }}
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged bundle
    needs: package
    if: startsWith(github.ref, 'refs/tags/huoxing-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: huoxing-linux-x86_64-cp312-${{ github.sha }}
          path: artifacts
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --verify-tag --title "$GITHUB_REF_NAME"
          --notes "Verified CPython 3.12 / Linux x86_64 wheel for the matching locked Pixi environment. Requires glibc 2.35 or newer. See docs/BINARY_DEPLOY.md."

